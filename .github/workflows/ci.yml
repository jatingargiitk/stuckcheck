name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -v
  readme-examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: README output blocks match real output
        run: python scripts/check_readme.py
      - name: stuckcheck checks the checks this repo would require
        run: stuckcheck . -r "test (3.9)" -r "test (3.13)" -r readme-examples -r install-via-pip-git --branch main
  install-via-pip-git:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip install from a git URL (the local checkout) and run the CLI
        run: |
          python -m pip install "git+file://${GITHUB_WORKSPACE}@${GITHUB_SHA}"
          stuckcheck --version
          stuckcheck names examples/demo --json > names.json
          python -c "import json; d=json.load(open('names.json')); assert 'test (3.1)' in [c['name'] for c in d], d"
